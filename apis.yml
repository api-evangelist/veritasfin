aid: veritasfin
name: Veritasfin
description: 'Veritas Finance Limited is a non-banking finance company (NBFC) in India
  focused on retail and micro, small and medium enterprise (MSME) lending to underserved
  and self-employed customers. Its lending products include MSME and business loans,
  loan against property, home loans, mortgage and working-capital finance, and used
  commercial vehicle loans, supported by an EMI calculator, branch network, online
  payment portals and an investor-relations and corporate-governance section. It was
  surfaced in the API Evangelist network as a portfolio company of Norwest Venture
  Partners. Public probing of veritasfin.in finds a corporate financial-services
  website with no developer portal, documentation, or public API surface at this time.'
